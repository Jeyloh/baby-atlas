<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#155dfc" />
    <title>Baby Atlas</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #0a0a0a;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: #737373;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: #155dfc;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Du er ikke på nett</h1>
      <p>
        Baby Atlas trenger internett for å hente dataene dine. Sjekk
        tilkoblingen din og prøv igjen.
      </p>
      <button type="button" onclick="location.reload()">Prøv igjen</button>
    </main>
  </body>
</html>
